<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Open source side -->
  <rect x="150" y="180" width="380" height="280" rx="12" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <text x="340" y="230" text-anchor="middle" fill="url(#grad)" font-size="18" font-family="sans-serif" opacity="0.7">Open Source</text>
  <!-- Unlocked icon -->
  <rect x="310" y="280" width="60" height="50" rx="8" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <path d="M320 280 L320 260 Q320 240 340 240 Q360 240 360 260" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <circle cx="340" cy="310" r="6" fill="url(#grad)" opacity="0.5"/>
  <!-- Checkmarks -->
  <path d="M200 370 L210 380 L225 360" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <text x="240" y="375" fill="url(#grad)" font-size="14" font-family="sans-serif" opacity="0.4">Free</text>
  <path d="M200 400 L210 410 L225 390" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <text x="240" y="405" fill="url(#grad)" font-size="14" font-family="sans-serif" opacity="0.4">Customizable</text>
  <path d="M200 430 L210 440 L225 420" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <text x="240" y="435" fill="url(#grad)" font-size="14" font-family="sans-serif" opacity="0.4">Data Ownership</text>
  <!-- VS -->
  <text x="600" y="330" text-anchor="middle" fill="url(#grad)" font-size="32" font-family="sans-serif" font-weight="bold" opacity="0.6">VS</text>
  <!-- Subscription side -->
  <rect x="670" y="180" width="380" height="280" rx="12" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <text x="860" y="230" text-anchor="middle" fill="#ef4444" font-size="18" font-family="sans-serif" opacity="0.5">Subscription</text>
  <!-- Locked icon -->
  <rect x="830" y="280" width="60" height="50" rx="8" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <path d="M840 280 L840 260 Q840 240 860 240 Q880 240 880 260 L880 280" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <circle cx="860" cy="310" r="6" fill="#ef4444" opacity="0.3"/>
  <!-- X marks -->
  <path d="M720 365 L735 380 M735 365 L720 380" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
  <text x="750" y="377" fill="#ef4444" font-size="14" font-family="sans-serif" opacity="0.3">Vendor Lock-in</text>
  <path d="M720 395 L735 410 M735 395 L720 410" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
  <text x="750" y="407" fill="#ef4444" font-size="14" font-family="sans-serif" opacity="0.3">Forever Fees</text>
  <path d="M720 425 L735 440 M735 425 L720 440" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
  <text x="750" y="437" fill="#ef4444" font-size="14" font-family="sans-serif" opacity="0.3">Rigid Templates</text>
  <!-- Decorative dots -->
  <circle cx="100" cy="150" r="3" fill="url(#grad)" opacity="0.1"/>
  <circle cx="1100" cy="500" r="3" fill="url(#grad)" opacity="0.08"/>
</svg>
