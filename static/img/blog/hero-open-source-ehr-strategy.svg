<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Open book / strategy document -->
  <path d="M500 200 L500 400 Q600 370 600 370 Q600 370 700 400 L700 200 Q600 170 600 170 Q600 170 500 200 Z" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="170" x2="600" y2="370" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
  <!-- Left page lines -->
  <line x1="520" y1="230" x2="580" y2="220" stroke="url(#grad)" stroke-width="1" opacity="0.25"/>
  <line x1="520" y1="255" x2="580" y2="245" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <line x1="520" y1="280" x2="580" y2="270" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <line x1="520" y1="305" x2="575" y2="296" stroke="url(#grad)" stroke-width="1" opacity="0.15"/>
  <line x1="520" y1="330" x2="580" y2="322" stroke="url(#grad)" stroke-width="1" opacity="0.15"/>
  <!-- Right page lines -->
  <line x1="620" y1="220" x2="680" y2="230" stroke="url(#grad)" stroke-width="1" opacity="0.25"/>
  <line x1="620" y1="245" x2="680" y2="255" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <line x1="620" y1="270" x2="680" y2="280" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <line x1="620" y1="296" x2="675" y2="305" stroke="url(#grad)" stroke-width="1" opacity="0.15"/>
  <!-- FHIR symbol above -->
  <circle cx="600" cy="120" r="30" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
  <path d="M585 120 L600 105 L615 120 L600 135 Z" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Connection lines from book to nodes -->
  <line x1="480" y1="280" x2="380" y2="260" stroke="url(#grad)" stroke-width="1" opacity="0.25" stroke-dasharray="4 3"/>
  <line x1="720" y1="280" x2="820" y2="260" stroke="url(#grad)" stroke-width="1" opacity="0.25" stroke-dasharray="4 3"/>
  <line x1="480" y1="340" x2="380" y2="380" stroke="url(#grad)" stroke-width="1" opacity="0.25" stroke-dasharray="4 3"/>
  <line x1="720" y1="340" x2="820" y2="380" stroke="url(#grad)" stroke-width="1" opacity="0.25" stroke-dasharray="4 3"/>
  <!-- Strategy nodes -->
  <circle cx="360" cy="250" r="20" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.35"/>
  <circle cx="840" cy="250" r="20" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.35"/>
  <circle cx="360" cy="390" r="20" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.35"/>
  <circle cx="840" cy="390" r="20" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.35"/>
  <!-- Arrow up from book (growth) -->
  <line x1="600" y1="430" x2="600" y2="480" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <polygon points="590,480 600,495 610,480" fill="url(#grad)" opacity="0.4"/>
  <!-- Decorative dots -->
  <circle cx="300" cy="150" r="3" fill="url(#grad)" opacity="0.1"/>
  <circle cx="900" cy="150" r="3" fill="url(#grad)" opacity="0.1"/>
  <circle cx="600" cy="540" r="3" fill="url(#grad)" opacity="0.08"/>
</svg>