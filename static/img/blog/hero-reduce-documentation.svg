<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Clock face -->
  <circle cx="400" cy="315" r="120" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <circle cx="400" cy="315" r="5" fill="url(#grad)" opacity="0.5"/>
  <!-- Clock hands -->
  <line x1="400" y1="315" x2="400" y2="220" stroke="url(#grad)" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="400" y1="315" x2="470" y2="340" stroke="url(#grad)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <!-- Clock markers -->
  <line x1="400" y1="200" x2="400" y2="210" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <line x1="400" y1="420" x2="400" y2="430" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <line x1="285" y1="315" x2="295" y2="315" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <line x1="505" y1="315" x2="515" y2="315" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <!-- Arrow showing time reduction -->
  <path d="M550 315 L650 315" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <polygon points="640,308 655,315 640,322" fill="url(#grad)" opacity="0.4"/>
  <!-- Five numbered items -->
  <rect x="700" y="170" width="350" height="50" rx="8" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="730" cy="195" r="14" fill="url(#grad)" opacity="0.15"/>
  <text x="730" y="200" text-anchor="middle" fill="url(#grad)" font-size="14" font-family="sans-serif" opacity="0.5">1</text>
  <rect x="755" y="188" width="140" height="10" rx="3" fill="url(#grad)" opacity="0.12"/>
  <rect x="700" y="235" width="350" height="50" rx="8" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="730" cy="260" r="14" fill="url(#grad)" opacity="0.15"/>
  <text x="730" y="265" text-anchor="middle" fill="url(#grad)" font-size="14" font-family="sans-serif" opacity="0.5">2</text>
  <rect x="755" y="253" width="120" height="10" rx="3" fill="url(#grad)" opacity="0.12"/>
  <rect x="700" y="300" width="350" height="50" rx="8" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="730" cy="325" r="14" fill="url(#grad)" opacity="0.15"/>
  <text x="730" y="330" text-anchor="middle" fill="url(#grad)" font-size="14" font-family="sans-serif" opacity="0.5">3</text>
  <rect x="755" y="318" width="160" height="10" rx="3" fill="url(#grad)" opacity="0.12"/>
  <rect x="700" y="365" width="350" height="50" rx="8" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="730" cy="390" r="14" fill="url(#grad)" opacity="0.15"/>
  <text x="730" y="395" text-anchor="middle" fill="url(#grad)" font-size="14" font-family="sans-serif" opacity="0.5">4</text>
  <rect x="755" y="383" width="130" height="10" rx="3" fill="url(#grad)" opacity="0.12"/>
  <rect x="700" y="430" width="350" height="50" rx="8" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="730" cy="455" r="14" fill="url(#grad)" opacity="0.15"/>
  <text x="730" y="460" text-anchor="middle" fill="url(#grad)" font-size="14" font-family="sans-serif" opacity="0.5">5</text>
  <rect x="755" y="448" width="110" height="10" rx="3" fill="url(#grad)" opacity="0.12"/>
  <!-- Decorative dots -->
  <circle cx="150" cy="200" r="3" fill="url(#grad)" opacity="0.1"/>
  <circle cx="1100" cy="500" r="3" fill="url(#grad)" opacity="0.08"/>
</svg>
