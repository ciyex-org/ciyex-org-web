<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Shared screen/monitor -->
  <rect x="400" y="160" width="400" height="260" rx="12" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="200" x2="800" y2="200" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <!-- Screen content: patient data -->
  <rect x="420" y="220" width="160" height="12" rx="3" fill="url(#grad)" opacity="0.15"/>
  <rect x="420" y="245" width="120" height="10" rx="3" fill="url(#grad)" opacity="0.1"/>
  <rect x="420" y="265" width="140" height="10" rx="3" fill="url(#grad)" opacity="0.1"/>
  <!-- Mini trend chart on screen -->
  <path d="M620 370 L650 340 L680 350 L710 310 L740 300 L770 280" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <circle cx="770" cy="280" r="4" fill="url(#grad)" opacity="0.4"/>
  <!-- Monitor stand -->
  <line x1="600" y1="420" x2="600" y2="460" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <line x1="550" y1="460" x2="650" y2="460" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <!-- Doctor (left side) -->
  <circle cx="250" cy="300" r="35" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <path d="M200 400 Q200 360 250 350 Q300 360 300 400" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <!-- Eye looking at screen -->
  <line x1="290" y1="290" x2="400" y2="280" stroke="url(#grad)" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
  <!-- Patient (right side) -->
  <circle cx="950" cy="300" r="35" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <path d="M900 400 Q900 360 950 350 Q1000 360 1000 400" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <!-- Eye looking at screen -->
  <line x1="910" y1="290" x2="800" y2="280" stroke="url(#grad)" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
  <!-- Trust/handshake symbol below -->
  <path d="M530 520 Q560 500 590 520" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M610 520 Q640 500 670 520" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="590" y1="520" x2="610" y2="520" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <!-- Portal icon -->
  <rect x="560" y="540" width="80" height="40" rx="6" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.25"/>
  <circle cx="600" cy="555" r="8" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="563" x2="600" y2="572" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <!-- Decorative dots -->
  <circle cx="130" cy="200" r="3" fill="url(#grad)" opacity="0.1"/>
  <circle cx="1080" cy="500" r="3" fill="url(#grad)" opacity="0.08"/>
</svg>
