<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Cursor/click icon -->
  <path d="M350 200 L350 340 L390 310 L430 370 L450 360 L410 300 L460 300 Z" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5" stroke-linejoin="round"/>
  <!-- Click ripples -->
  <circle cx="350" cy="200" r="30" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <circle cx="350" cy="200" r="50" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.1"/>
  <circle cx="350" cy="200" r="70" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.05"/>
  <!-- Patient-doctor connection -->
  <!-- Doctor silhouette -->
  <circle cx="750" cy="240" r="30" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <path d="M710 320 Q710 290 750 280 Q790 290 790 320" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <!-- Patient silhouette -->
  <circle cx="900" cy="240" r="30" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <path d="M860 320 Q860 290 900 280 Q940 290 940 320" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <!-- Connection line -->
  <path d="M785 260 Q825 230 865 260" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3" stroke-dasharray="5,5"/>
  <!-- Heart/care symbol -->
  <path d="M820 250 Q825 240 835 245 Q840 255 825 265 Q810 255 815 245 Q825 240 820 250" fill="url(#grad)" opacity="0.3"/>
  <!-- Simplified dashboard below -->
  <rect x="650" y="360" width="400" height="150" rx="10" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <line x1="650" y1="395" x2="1050" y2="395" stroke="url(#grad)" stroke-width="1" opacity="0.15"/>
  <!-- Dashboard grid items -->
  <rect x="670" y="410" width="85" height="40" rx="5" fill="url(#grad)" opacity="0.08"/>
  <rect x="770" y="410" width="85" height="40" rx="5" fill="url(#grad)" opacity="0.08"/>
  <rect x="870" y="410" width="85" height="40" rx="5" fill="url(#grad)" opacity="0.08"/>
  <rect x="970" y="410" width="60" height="40" rx="5" fill="url(#grad)" opacity="0.08"/>
  <rect x="670" y="460" width="180" height="30" rx="5" fill="url(#grad)" opacity="0.06"/>
  <rect x="870" y="460" width="160" height="30" rx="5" fill="url(#grad)" opacity="0.06"/>
  <!-- Arrow: less clicks to more interaction -->
  <path d="M480 300 Q550 280 620 300" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <polygon points="612,294 625,300 612,306" fill="url(#grad)" opacity="0.3"/>
  <!-- Decorative dots -->
  <circle cx="200" cy="450" r="3" fill="url(#grad)" opacity="0.1"/>
  <circle cx="1100" cy="150" r="3" fill="url(#grad)" opacity="0.08"/>
</svg>
