<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Growth chart -->
  <line x1="350" y1="420" x2="350" y2="180" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="350" y1="420" x2="850" y2="420" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
  <!-- Grid lines -->
  <line x1="350" y1="360" x2="850" y2="360" stroke="url(#grad)" stroke-width="0.5" opacity="0.1"/>
  <line x1="350" y1="300" x2="850" y2="300" stroke="url(#grad)" stroke-width="0.5" opacity="0.1"/>
  <line x1="350" y1="240" x2="850" y2="240" stroke="url(#grad)" stroke-width="0.5" opacity="0.1"/>
  <!-- Growth curve -->
  <path d="M370 400 Q450 390 500 360 Q550 330 600 280 Q650 230 720 210 Q790 190 840 185" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
  <!-- Area fill under curve -->
  <path d="M370 400 Q450 390 500 360 Q550 330 600 280 Q650 230 720 210 Q790 190 840 185 L840 420 L370 420 Z" fill="url(#grad)" opacity="0.08"/>
  <!-- Data points -->
  <circle cx="370" cy="400" r="5" fill="url(#grad)" opacity="0.6"/>
  <circle cx="500" cy="360" r="5" fill="url(#grad)" opacity="0.6"/>
  <circle cx="600" cy="280" r="5" fill="url(#grad)" opacity="0.7"/>
  <circle cx="720" cy="210" r="5" fill="url(#grad)" opacity="0.7"/>
  <circle cx="840" cy="185" r="5" fill="url(#grad)" opacity="0.8"/>
  <!-- Building blocks (scaling) -->
  <rect x="900" y="350" width="60" height="70" rx="4" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <rect x="900" y="290" width="60" height="55" rx="4" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.35"/>
  <rect x="900" y="240" width="60" height="45" rx="4" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
  <!-- Arrow going up -->
  <line x1="930" y1="230" x2="930" y2="180" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <polygon points="920,185 930,170 940,185" fill="url(#grad)" opacity="0.5"/>
  <!-- Small icons in blocks -->
  <circle cx="930" cy="385" r="8" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.25"/>
  <circle cx="930" cy="318" r="8" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
  <circle cx="930" cy="262" r="8" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.35"/>
  <!-- Decorative dots -->
  <circle cx="280" cy="200" r="3" fill="url(#grad)" opacity="0.1"/>
  <circle cx="600" cy="500" r="3" fill="url(#grad)" opacity="0.08"/>
</svg>