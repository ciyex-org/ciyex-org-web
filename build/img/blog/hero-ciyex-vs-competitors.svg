<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Shield (Ciyex) center -->
  <path d="M600 180 L650 200 L650 280 C650 320 600 360 600 360 C600 360 550 320 550 280 L550 200 Z" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.8"/>
  <path d="M580 270 L595 285 L625 255" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Left competitor box -->
  <rect x="280" y="230" width="120" height="90" rx="8" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="255" x2="380" y2="255" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <line x1="300" y1="275" x2="360" y2="275" stroke="url(#grad)" stroke-width="1" opacity="0.15"/>
  <line x1="300" y1="295" x2="370" y2="295" stroke="url(#grad)" stroke-width="1" opacity="0.15"/>
  <!-- Right competitor box -->
  <rect x="800" y="230" width="120" height="90" rx="8" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>
  <line x1="820" y1="255" x2="900" y2="255" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  <line x1="820" y1="275" x2="880" y2="275" stroke="url(#grad)" stroke-width="1" opacity="0.15"/>
  <line x1="820" y1="295" x2="890" y2="295" stroke="url(#grad)" stroke-width="1" opacity="0.15"/>
  <!-- Arrows from competitors to Ciyex -->
  <line x1="400" y1="275" x2="540" y2="275" stroke="url(#grad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 4"/>
  <polygon points="540,270 550,275 540,280" fill="url(#grad)" opacity="0.4"/>
  <line x1="800" y1="275" x2="660" y2="275" stroke="url(#grad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 4"/>
  <polygon points="660,270 650,275 660,280" fill="url(#grad)" opacity="0.4"/>
  <!-- "VS" text indicators -->
  <circle cx="470" cy="275" r="16" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
  <circle cx="730" cy="275" r="16" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
  <!-- Bottom comparison bars -->
  <rect x="350" y="400" width="500" height="8" rx="4" fill="url(#grad)" opacity="0.15"/>
  <rect x="350" y="400" width="420" height="8" rx="4" fill="url(#grad)" opacity="0.5"/>
  <rect x="350" y="425" width="500" height="8" rx="4" fill="url(#grad)" opacity="0.15"/>
  <rect x="350" y="425" width="380" height="8" rx="4" fill="url(#grad)" opacity="0.4"/>
  <rect x="350" y="450" width="500" height="8" rx="4" fill="url(#grad)" opacity="0.15"/>
  <rect x="350" y="450" width="460" height="8" rx="4" fill="url(#grad)" opacity="0.45"/>
  <!-- Decorative dots -->
  <circle cx="250" cy="180" r="3" fill="url(#grad)" opacity="0.12"/>
  <circle cx="950" cy="180" r="3" fill="url(#grad)" opacity="0.12"/>
  <circle cx="600" cy="500" r="3" fill="url(#grad)" opacity="0.1"/>
</svg>